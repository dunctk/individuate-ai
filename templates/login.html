{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-fraunces font-bold text-integral-turquoise mb-2">IndividuateAI</h1>
            <p class="text-sage-mist text-sm">Sign in to continue your journey</p>
        </div>
        <div class="bg-void-green border border-sage-mist rounded-xl p-6 space-y-5">
            <div>
                <button id="passkey-login-btn"
                    class="w-full min-h-11 bg-integral-turquoise text-void-green font-semibold rounded-lg px-4 py-2 text-base hover:bg-integral-turquoise/90 transition-colors">
                    Sign in with Passkey
                </button>
                <div id="passkey-login-error" class="text-red-400 text-xs mt-1 hidden"></div>
            </div>
            <a href="/recovery"
               class="min-h-11 flex items-center justify-center text-sm text-sage-light hover:text-parchment transition-colors">
                Use a recovery key
            </a>
        </div>
        <p class="text-center text-xs text-sage-mist mt-4">
            Don't have an account?
            <a href="/signup" class="text-integral-turquoise hover:underline">Sign up</a>
        </p>
    </div>
</div>
<script>
document.getElementById('passkey-login-btn').addEventListener('click', async () => {
    const errEl = document.getElementById('passkey-login-error');
    const button = document.getElementById('passkey-login-btn');
    errEl.classList.add('hidden');
    button.disabled = true;
    button.textContent = 'Waiting for Passkey…';
    try {
        const resp = await fetch('/api/passkey/login/start', {
            method: 'POST',
        });
        if (!resp.ok) { const e = await resp.json(); throw new Error(e.error || 'Start failed'); }
        const { challenge_id, options } = await resp.json();
        const passkey = await window.loginPasskey(options);
        const verify = await fetch('/api/passkey/login/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ challenge_id, credential: passkey.credential, prf_output: passkey.prf_output, prf_enabled: passkey.prf_enabled })
        });
        if (!verify.ok) { const e = await verify.json(); throw new Error(e.error || 'Verification failed'); }
        const result = await verify.json();
        if (result.redirect) { window.location.href = result.redirect; }
    } catch (e) {
        errEl.textContent = e.name === 'NotAllowedError'
            ? 'Passkey sign-in was cancelled or no passkey is available.'
            : e.message;
        errEl.classList.remove('hidden');
    } finally {
        button.disabled = false;
        button.textContent = 'Sign in with Passkey';
    }
});
</script>
{% endblock %}
