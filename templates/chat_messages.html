{% for message in messages %}
{% if message.role == 'user' %}
<div class="flex flex-row-reverse gap-2.5 items-start animate-grow-in delay-grow-{{ (loop.index0 % 5) + 1 }}" data-chat-role="user">
    <div class="avatar-orb avatar-user">Y</div>
    <div class="flex flex-col items-end min-w-0 max-w-[78%]">
        <span class="role-label mb-1 text-right">You</span>
        <div class="bubble bubble-user" data-chat-markdown="{{ message.content|e }}">{{ message.content_html|safe }}</div>
    </div>
</div>
{% else %}
<div class="flex flex-row gap-2.5 items-start animate-grow-in delay-grow-{{ (loop.index0 % 5) + 1 }}" data-chat-role="assistant">
    <div class="avatar-orb avatar-therapist avatar-video-wrap" aria-label="Therapist">
        <img class="avatar-still" src="/mandala-avatar.jpg" alt="">
        <span class="avatar-video-fallback">T</span>
    </div>
    <div class="flex flex-col items-start min-w-0 max-w-[78%]">
        <span class="role-label mb-1">Therapist</span>
        <div class="bubble bubble-therapist" data-chat-markdown="{{ message.content|e }}">{{ message.content_html|safe }}</div>
        <div class="therapist-audio" data-state="idle">
            <button type="button" class="therapist-audio-trigger" onclick="readTherapistMessage(this)" aria-label="Read therapist message aloud" title="Read aloud">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3H5Z"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18 7a7.5 7.5 0 0 1 0 10"/></svg>
            </button>
            <div class="therapist-audio-playback hidden" role="group" aria-label="Therapist message playback controls">
                <button type="button" class="therapist-audio-button" onclick="seekSpokenResponse(-15)" aria-label="Go back 15 seconds" title="Back 15 seconds">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H5V3M5.4 7.1A8 8 0 1 1 4 14"/><text x="12" y="16">15</text></svg>
                </button>
                <button type="button" class="therapist-audio-button therapist-audio-primary" onclick="toggleSpokenResponse()" aria-label="Play therapist message" title="Play">
                    <svg class="therapist-audio-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 8 5-8 5Z"/></svg>
                </button>
                <button type="button" class="therapist-audio-button" onclick="seekSpokenResponse(15)" aria-label="Go forward 15 seconds" title="Forward 15 seconds">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7h4V3m-.4 4.1A8 8 0 1 0 20 14"/><text x="12" y="16">15</text></svg>
                </button>
                <span class="therapist-audio-status" role="status" aria-live="polite">Preparing…</span>
            </div>
        </div>
    </div>
</div>
{% endif %}
{% endfor %}
