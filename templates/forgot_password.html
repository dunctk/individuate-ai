{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-fraunces font-bold text-integral-turquoise mb-2">Reset Password</h1>
            <p class="text-sage-mist text-sm">Enter your email to receive a reset link</p>
        </div>
        <div class="bg-void-green border border-sage-mist rounded-xl p-6 space-y-5">
            <div id="forgot-password-form">
                <label class="block text-sm text-sage-mist mb-1.5" for="reset-email">Email</label>
                <input id="reset-email" type="email" placeholder="you@example.com"
                    class="w-full bg-[#1A2B26] border border-sage-mist rounded-lg px-3 py-2 text-parchment text-sm placeholder:text-sage-mist/50 focus:outline-none focus:border-integral-turquoise transition-colors">
                <button id="send-reset-btn"
                    class="w-full mt-2 bg-integral-turquoise text-void-green font-semibold rounded-lg px-4 py-2 text-sm hover:bg-integral-turquoise/90 transition-colors">
                    Send Reset Link
                </button>
                <div id="reset-error" class="text-red-400 text-xs mt-1 hidden"></div>
            </div>
            <div id="reset-success" class="hidden text-center">
                <div class="text-integral-turquoise text-sm font-semibold mb-2">Check your email</div>
                <p class="text-sage-mist text-xs">If an account exists with that email, we've sent a reset link. (In development, check the server logs.)</p>
                <div id="dev-reset-url" class="mt-2 text-xs text-integral-turquoise break-all hidden"></div>
            </div>
        </div>
        <p class="text-center text-xs text-sage-mist mt-4">
            <a href="/login" class="text-integral-turquoise hover:underline">Back to sign in</a>
        </p>
    </div>
</div>
<script>
document.getElementById('send-reset-btn').addEventListener('click', async () => {
    const email = document.getElementById('reset-email').value.trim();
    const errEl = document.getElementById('reset-error');
    const formEl = document.getElementById('forgot-password-form');
    const successEl = document.getElementById('reset-success');
    const devUrlEl = document.getElementById('dev-reset-url');
    errEl.classList.add('hidden');
    if (!email) { errEl.textContent = 'Enter your email'; errEl.classList.remove('hidden'); return; }
    try {
        const resp = await fetch('/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await resp.json();
        formEl.classList.add('hidden');
        successEl.classList.remove('hidden');
        if (data.dev_reset_url) {
            devUrlEl.textContent = 'Dev URL: ' + data.dev_reset_url;
            devUrlEl.classList.remove('hidden');
        }
    } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
    }
});
</script>
{% endblock %}
