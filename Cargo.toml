[package]
name = "individuateai"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.7", optional = true }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
leptos = { version = "0.6" }
leptos_axum = { version = "0.6", optional = true }
leptos_meta = { version = "0.6" }
leptos_router = { version = "0.6" }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
tower = { version = "0.4", optional = true, features = ["util"] }
tower-http = { version = "0.5", features = ["fs"], optional = true }
wasm-bindgen = "=0.2.106"
thiserror = "1"
tracing = { version = "0.1", optional = true }
http = "1"
cfg-if = "1.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = { version = "1", optional = true }
urlencoding = "2"
dotenvy = { version = "0.15", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
rig-core = { version = "0.26", features = ["derive"], optional = true }
rig-sqlite = { version = "0.1.29", optional = true }
sqlite-vec = { version = "0.1", optional = true }
tokio-rusqlite = { version = "0.6", features = ["bundled"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[features]
csr = ["leptos/csr", "leptos_meta/csr", "leptos_router/csr"]
hydrate = ["leptos/hydrate", "leptos_meta/hydrate", "leptos_router/hydrate"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:tracing",
    "dep:anyhow",
    "dep:rig-core",
    "dep:rig-sqlite",
    "dep:sqlite-vec",
    "dep:tokio-rusqlite",
    "dep:rusqlite",
    "dep:tokio-stream",
    "dep:dotenvy",
    "dep:reqwest",
]

[package.metadata.leptos]
output-name = "individuateai"
site-root = "target/site"
site-pkg_dir = "pkg"
style-file = "style/output.css"
assets-dir = "public"
site-addr = "127.0.0.1:3004"
reload-port = 3005
end2end-cmd = "npx playwright test"
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
