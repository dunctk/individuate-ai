{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-fraunces font-bold text-integral-turquoise mb-2">Choose New Password</h1>
            <p class="text-sage-mist text-sm">Enter your new password below</p>
        </div>
        <div class="bg-void-green border border-sage-mist rounded-xl p-6 space-y-5">
            <div id="reset-password-form">
                <div>
                    <label class="block text-sm text-sage-mist mb-1" for="new-password">New Password</label>
                    <input id="new-password" type="password" placeholder="At least 8 characters"
                        class="w-full bg-[#1A2B26] border border-sage-mist rounded-lg px-3 py-2 text-parchment text-sm placeholder:text-sage-mist/50 focus:outline-none focus:border-integral-turquoise transition-colors">
                </div>
                <div>
                    <label class="block text-sm text-sage-mist mb-1" for="confirm-password">Confirm Password</label>
                    <input id="confirm-password" type="password" placeholder="Repeat your password"
                        class="w-full bg-[#1A2B26] border border-sage-mist rounded-lg px-3 py-2 text-parchment text-sm placeholder:text-sage-mist/50 focus:outline-none focus:border-integral-turquoise transition-colors">
                </div>
                <button id="reset-password-btn"
                    class="w-full bg-integral-turquoise text-void-green font-semibold rounded-lg px-4 py-2 text-sm hover:bg-integral-turquoise/90 transition-colors">
                    Reset Password
                </button>
                <div id="reset-error" class="text-red-400 text-xs mt-1 hidden"></div>
            </div>
            <div id="reset-success" class="hidden text-center">
                <div class="text-integral-turquoise text-sm font-semibold mb-2">Password Reset!</div>
                <p class="text-sage-mist text-xs">You can now sign in with your new password.</p>
                <a href="/login"
                    class="inline-block mt-3 bg-integral-turquoise text-void-green font-semibold rounded-lg px-4 py-2 text-sm hover:bg-integral-turquoise/90 transition-colors">
                    Sign In
                </a>
            </div>
        </div>
        <p class="text-center text-xs text-sage-mist mt-4">
            <a href="/login" class="text-integral-turquoise hover:underline">Back to sign in</a>
        </p>
    </div>
</div>
<script>
document.getElementById('reset-password-btn').addEventListener('click', async () => {
    const password = document.getElementById('new-password').value;
    const confirm = document.getElementById('confirm-password').value;
    const errEl = document.getElementById('reset-error');
    const formEl = document.getElementById('reset-password-form');
    const successEl = document.getElementById('reset-success');
    errEl.classList.add('hidden');
    if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters'; errEl.classList.remove('hidden'); return; }
    if (password !== confirm) { errEl.textContent = 'Passwords do not match'; errEl.classList.remove('hidden'); return; }
    try {
        const resp = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: '{{ token }}', password })
        });
        const data = await resp.json();
        if (!resp.ok) { throw new Error(data.error || 'Reset failed'); }
        formEl.classList.add('hidden');
        successEl.classList.remove('hidden');
    } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
    }
});
</script>
{% endblock %}
