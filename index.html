<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>IndividuateAI</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/pkg/individuateai.css"/>
    
    <!-- D3.js & Mind Map Logic -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/passkey.js"></script>
    <script>
        console.log("MindMap script loading...");
        // Color Palette from UI Design
        const COLORS = {
            background: "#0F1C18",
            text: "#F2F0E9",
            nodeBorder: "#4A635D",
            link: "#4A635D",
            categories: {
                "Trigger": "#E9C46A", // Systemic Yellow
                "Belief": "#2A9D8F",  // Integral Turquoise
                "Emotion": "#F2F0E9", // Parchment
                "Somatic": "#4A635D", // Sage Mist
                "Pattern": "#ffffff", // White/Ghost
                "Need": "#E9C46A",
                "Goal": "#2A9D8F",
                "Resource": "#F2F0E9",
                "Other": "#888888"
            }
        };

        window.renderMindMap = function(containerId, data) {
            console.group("renderMindMap Debug");
            console.log("Container ID:", containerId);
            console.log("Data received:", data);

            if (typeof d3 === 'undefined') {
                console.error("CRITICAL: D3.js is not loaded!");
                console.groupEnd();
                return;
            }

            const container = document.getElementById(containerId);
            if (!container) {
                console.error("CRITICAL: Container element not found in DOM:", containerId);
                console.groupEnd();
                return;
            }

            // Check dimensions
            let width = container.clientWidth;
            let height = container.clientHeight;
            console.log(`Container Dimensions: ${width}x${height}`);

            if (width === 0 || height === 0) {
                console.warn("Container has 0 dimension, falling back to 800x600");
                width = width || 800;
                height = height || 600;
            }

            // Clear previous graph
            container.innerHTML = '';

            try {
                if (!data || !data.nodes || !data.edges) {
                    console.error("Invalid data structure:", data);
                    console.groupEnd();
                    return;
                }

                // Deep copy data to avoid mutating the original passed from Rust
                const nodes = data.nodes.map(d => ({ ...d }));
                const links = data.edges.map(d => ({ ...d, source: d.from, target: d.to }));
                
                console.log(`Processing ${nodes.length} nodes and ${links.length} links`);

                // Create SVG
                const svg = d3.select(container)
                    .append("svg")
                    .attr("width", "100%")
                    .attr("height", "100%")
                    .attr("viewBox", [0, 0, width, height])
                    .style("background-color", COLORS.background)
                    .style("border-radius", "1rem");

                // Add a group for the graph content to allow zooming
                const g = svg.append("g");

                // Zoom behavior
                const zoom = d3.zoom()
                    .scaleExtent([0.1, 4])
                    .on("zoom", (event) => {
                        g.attr("transform", event.transform);
                    });

                svg.call(zoom);

                // Simulation setup
                console.log("Initializing force simulation...");
                const simulation = d3.forceSimulation(nodes)
                    .force("link", d3.forceLink(links).id(d => d.id).distance(150))
                    .force("charge", d3.forceCharge().strength(-500))
                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("collide", d3.forceCollide().radius(50));

                // Arrow marker
                svg.append("defs").selectAll("marker")
                    .data(["end"])
                    .enter().append("marker")
                    .attr("id", "arrow")
                    .attr("viewBox", "0 -5 10 10")
                    .attr("refX", 25) 
                    .attr("refY", 0)
                    .attr("markerWidth", 6)
                    .attr("markerHeight", 6)
                    .attr("orient", "auto")
                    .append("path")
                    .attr("d", "M0,-5L10,0L0,5")
                    .attr("fill", COLORS.link)
                    .style("opacity", 0.6);

                // Links
                const link = g.append("g")
                    .attr("stroke", COLORS.link)
                    .attr("stroke-opacity", 0.6) 
                    .attr("stroke-width", 2)
                    .selectAll("line")
                    .data(links)
                    .join("line")
                    .attr("marker-end", "url(#arrow)");

                // Link Labels (Relationships)
                const linkLabel = g.append("g")
                    .selectAll("text")
                    .data(links)
                    .join("text")
                    .text(d => d.relation)
                    .attr("font-size", "10px")
                    .attr("fill", COLORS.text)
                    .style("opacity", 0.8)
                    .attr("text-anchor", "middle")
                    .style("pointer-events", "none");

                // Nodes
                const node = g.append("g")
                    .attr("stroke", COLORS.nodeBorder)
                    .attr("stroke-width", 2)
                    .selectAll("circle")
                    .data(nodes)
                    .join("circle")
                    .attr("r", 12) 
                    .attr("fill", d => COLORS.categories[d.category] || COLORS.categories["Other"])
                    .call(drag(simulation));

                // Node Labels
                const label = g.append("g")
                    .selectAll("text")
                    .data(nodes)
                    .join("text")
                    .text(d => d.label)
                    .attr("x", 16)
                    .attr("y", 5)
                    .attr("font-family", "Urbanist, sans-serif")
                    .attr("font-size", "14px")
                    .attr("font-weight", "bold")
                    .attr("fill", COLORS.text)
                    .style("pointer-events", "none")
                    .style("text-shadow", "0 2px 4px #000");

                // Tooltip/Title on hover
                node.append("title")
                    .text(d => `${d.label}\n[${d.category}]`);

                // Simulation tick
                simulation.on("tick", () => {
                    link
                        .attr("x1", d => d.source.x)
                        .attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x)
                        .attr("y2", d => d.target.y);

                    linkLabel
                        .attr("x", d => (d.source.x + d.target.x) / 2)
                        .attr("y", d => (d.source.y + d.target.y) / 2);

                    node
                        .attr("cx", d => d.x)
                        .attr("cy", d => d.y);

                    label
                        .attr("x", d => d.x + 16)
                        .attr("y", d => d.y + 5);
                });

                // Drag behavior
                function drag(simulation) {
                    function dragstarted(event) {
                        if (!event.active) simulation.alphaTarget(0.3).restart();
                        event.subject.fx = event.subject.x;
                        event.subject.fy = event.subject.y;
                    }

                    function dragged(event) {
                        event.subject.fx = event.x;
                        event.subject.fy = event.y;
                    }

                    function dragended(event) {
                        if (!event.active) simulation.alphaTarget(0);
                        event.subject.fx = null;
                        event.subject.fy = null;
                    }

                    return d3.drag()
                        .on("start", dragstarted)
                        .on("drag", dragged)
                        .on("end", dragended);
                }
                console.log("Graph rendered successfully.");

            } catch (e) {
                console.error("Error inside D3 logic:", e);
            }
            console.groupEnd();
        };
        console.log("MindMap script loaded and renderMindMap attached to window.");
    </script>
  </head>
  <body>
    <!-- App injected here -->
  </body>
</html>
