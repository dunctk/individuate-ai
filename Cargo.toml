[package]
name = "individuateai"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
axum-extra = { version = "0.12.3", features = ["cookie", "cookie-signed", "cookie-private"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
minijinja = "2"
cookie = { version = "0.18", features = ["private", "percent-encode"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http = "1"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
urlencoding = "2"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
rig-core = { version = "0.26", features = ["derive"] }
rig-sqlite = "0.1.29"
sqlite-vec = "0.1"
tokio-rusqlite = { version = "0.6", features = ["bundled"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow = "1"
argon2 = "0.5.3"
time = "0.3.44"
dashmap = "6.1.0"
webauthn-rs = "0.5.4"
webauthn-rs-proto = "0.5.4"
serde_cbor_2 = "0.13"
schemars = "1.1"
thiserror = "1"
